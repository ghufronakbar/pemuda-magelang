services:
  # --- APP (Sama) ---
  app:
    build:
      context: ./pemuda-magelang-app
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    depends_on:
      migrator:
        condition: service_completed_successfully

  # --- MIGRATOR (Sama) ---
  migrator:
    build:
      context: ./pemuda-magelang-app
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_started

  # --- DATABASE (SECURED) ---
  db:
    image: postgres:16-alpine
    container_name: pemuda_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # [PENTING] HAPUS PORTS! 
    # Database tidak boleh diakses langsung dari internet (Port 5432).
    # Aplikasi akses lewat jaringan internal Docker.
    ports: !reset []
    #   - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- OBJECT STORAGE (SECURED) ---
  minio:
    image: minio/minio
    container_name: pemuda_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # [PENTING] HAPUS PORTS!
    # API MinIO hanya diakses oleh Nginx (untuk gambar) dan App (untuk upload) via internal network.
    ports: !reset []
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc
    container_name: pemuda_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "sleep 5; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME}; /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME}; echo '✅ MinIO Ready!'; exit 0;"

  # --- REVERSE PROXY (SSL & HTTPS) ---
  gateway:
    image: nginx:alpine
    container_name: pemuda_nginx
    restart: always
    ports:
      - "80:80" # HTTP (Untuk Redirect ke HTTPS)
      - "443:443" # HTTPS (SSL)
    volumes:
      # Config Nginx Production
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      # Mount seluruh folder Letsencrypt agar symlink terbaca
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # [BARU] Mount folder maintenance agar bisa kirim sinyal ke Nginx
      - ./nginx/maintenance:/etc/nginx/maintenance_control
    # [HAPUS] extra_hosts tidak diperlukan di Linux Server
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - minio

  backup-service:
    build: ./pemuda-magelang-backup
    container_name: pemuda_backup
    restart: always
    depends_on:
      - db
      - minio
    volumes:
      - ./pemuda-magelang-backup/state.json:/app/state.json
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - BACKUP_NODEMAILER_EMAIL_USER=${BACKUP_NODEMAILER_EMAIL_USER}
      - BACKUP_NODEMAILER_EMAIL_PASS=${BACKUP_NODEMAILER_EMAIL_PASS}
      - BACKUP_NODEMAILER_EMAIL_TO=${BACKUP_NODEMAILER_EMAIL_TO}

volumes:
  postgres_data:
  minio_data:
